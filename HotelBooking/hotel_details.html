<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Details</title>

  <!-- Bootstrap 5 CSS (CDN) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white fixed-top shadow-sm">
    <div class="container-fluid px-3">
      <span class="fs-4 me-3" id="sidebarToggle" role="button" aria-label="Toggle sidebar" style="cursor:pointer;">&#9776;</span>
      <a class="navbar-brand fw-bold" href="index.html">
        <img src="images\logo.jfif" alt="Logo" width="32" height="32" class="d-inline-block align-text-top rounded me-2">
        HotelHub
      </a>
      <div class="mx-auto d-none d-md-block" style="width: 40%;">
        <input class="form-control rounded-pill" type="search" placeholder="Search" aria-label="Search">
      </div>
      <img src="images/profile-placeholder.png" alt="Profile" width="36" height="36" class="rounded-circle">
    </div>
  </nav>

  <!-- Sidebar -->
  <div class="sidebar bg-white shadow-sm" id="sidebar">
    <div class="p-3">
      <ul class="nav flex-column">
        <li class="nav-item mb-2"><a href="index.html" class="nav-link text-dark">Dashboard</a></li>
        <li class="nav-item mb-2"><a href="#" class="nav-link text-dark">Activities</a></li>
        <li class="nav-item mb-2"><a href="#" class="nav-link text-dark">Gallery</a></li>
        <li class="nav-item mb-2"><a href="#" class="nav-link text-dark">Favorites</a></li>
        <li class="nav-item mb-2"><a href="#" class="nav-link text-dark">Settings</a></li>
        <li class="nav-item mb-2"><a href="#" class="nav-link text-dark">Contact</a></li>
      </ul>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content" id="mainContent">

    <nav aria-label="breadcrumb" class="mb-4">
      <ol class="breadcrumb">
        <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none">Hotels</a></li>
        <li class="breadcrumb-item active" aria-current="page">Details</li>
      </ol>
    </nav>

    <!-- This container is filled in dynamically by script.js -->
    <section id="hotelDetails" class="mb-5">
      <div class="row g-4">

        <div class="col-12 col-lg-6">
          <img id="hotelImage" src="" alt="" class="img-fluid rounded-4 shadow-sm w-100">
        </div>

        <div class="col-12 col-lg-6">
          <span id="hotelStars" class="badge bg-primary rounded-pill mb-2"></span>
          <h1 id="hotelName" class="fw-bold mb-2">Loading...</h1>
          <p class="text-muted mb-1">
            <strong>Location:</strong> <span id="hotelLocation"></span>
          </p>
          <p class="text-muted mb-3">
            <strong>Price:</strong> <span id="hotelPrice"></span>
          </p>
          <p id="hotelDescription" class="mb-4"></p>

          <button type="button" class="btn btn-primary btn-lg rounded-pill me-2">Book Now</button>
          <a href="index.html" class="btn btn-outline-secondary btn-lg rounded-pill">Back to Hotels</a>
        </div>

      </div>
    </section>

  </div>

  <!-- Footer -->
  <footer class="bg-light pt-5 pb-4">
    <div class="container-fluid px-4">
      <hr class="mt-1">
      <p class="text-center text-muted small mb-0">&copy; 2026 HotelHub. Built for learning purposes.</p>
    </div>
  </footer>

  <!-- Shared hotel data (must load BEFORE script.js) -->
  <script src="js/hotels-data.js"></script>
  <script src="script.js"></script>

</body>
</html>
